name: CI and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  check:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & Typecheck Backend
        run: |
          cd backend
          npm ci
          npm run typecheck

      - name: Install, Lint, Test & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run build

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        env:
          RAW_TOKEN: ${{ secrets.CFLARE_API_TOKEN_VF }}
          CLOUDFLARE_ACCOUNT_ID: 3c2a3d9cf4b7a29183669f8ef6f334d2
        run: |
          if [[ "$RAW_TOKEN" =~ Bearer[[:space:]]+([A-Za-z0-9_-]+) ]]; then
            CLEAN_TOKEN="${BASH_REMATCH[1]}"
          else
            CLEAN_TOKEN=$(echo "$RAW_TOKEN" | tr -d '\r\n "'\''')
          fi
          CLOUDFLARE_API_TOKEN="$CLEAN_TOKEN" npx wrangler pages deploy frontend/dist --project-name=vincent-flowers-porto --branch=main
