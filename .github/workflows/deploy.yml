name: CI and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  check:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & Typecheck Backend
        run: |
          cd backend
          npm ci
          npm run typecheck

      - name: Install, Lint & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CFLARE_API_TOKEN_VF || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3c2a3d9cf4b7a29183669f8ef6f334d2
          command: pages deploy frontend/dist --project-name=vincent-flowers-porto --branch=main
